events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 600m;

    # Cache de midia em disco. Tamanhos calibrados para uma VPS pequena;
    # max_size=2g impede que o cache cresca indefinidamente; inactive=30d
    # remove ficheiros nao acessados durante 30 dias. keys_zone=media_cache
    # mantem 32 MB de metadados em RAM (~250 mil chaves).
    proxy_cache_path /var/cache/nginx/media
        levels=1:2
        keys_zone=media_cache:32m
        max_size=2g
        inactive=30d
        use_temp_path=off;

    upstream web_upstream {
        server web:3000;
    }

    upstream api_upstream {
        server api:4000;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://api_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 600m;
        }

        # Midia servida pela API a partir de LOCAL_STORAGE_DIR (STORAGE_DRIVER=local).
        # proxy_cache: a resposta da API tem `Cache-Control: public, max-age=...`
        # e o Nginx mantem o ficheiro em disco. proxy_cache_lock evita que dois
        # pedidos simultaneos para o mesmo ficheiro frio gerem dois MISS.
        location /media/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 600m;

            proxy_cache media_cache;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 7d;
            proxy_cache_valid 404 5m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_revalidate on;
            # `proxy_buffering on` e essencial: sem isto, proxy_cache nao guarda
            # a resposta. Trade-off vs streaming: para ficheiros < 2 GB ok.
            proxy_buffering on;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
